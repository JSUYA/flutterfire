name: firebase_storage_tizen_example
description: Demonstrates how to use the firebase_storage plugin.

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  firebase_core: ^4.7.0
  firebase_core_tizen:
    path: ../../firebase_core
  firebase_storage: ^13.3.0
  firebase_storage_tizen:
    path: ../
  flutter:
    sdk: flutter
  image_picker: ^0.8.6
  image_picker_tizen: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  integration_test_tizen: ^2.0.1

dependency_overrides:
  firebase_core_tizen:
    path: ../../firebase_core
  firebase_storage_tizen:
    path: ../

flutter:
  uses-material-design: true
  assets:
    - assets/hello.txt
