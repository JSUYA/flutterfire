name: firebase_storage_tizen_example
description: Demonstrates how to use the firebase_storage_tizen plugin.

publish_to: 'none'

environment:
  flutter: '>=3.27.0'
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  firebase_core: ^4.7.0
  firebase_core_tizen: ^2.0.0
  firebase_storage: ^13.3.0
  firebase_storage_tizen:
    path: ..
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  integration_test_tizen: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/hello.txt
