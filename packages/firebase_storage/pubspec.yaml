name: firebase_storage_tizen
description: Tizen implementation of the firebase_storage plugin, implemented as a streaming REST client rather than via firebase_dart (which has unresolved Storage bugs).
version: 0.2.0
homepage: https://github.com/flutter-tizen/flutterfire
repository: https://github.com/flutter-tizen/flutterfire/tree/main/packages/firebase_storage

environment:
  flutter: '>=3.27.0'
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  firebase_core: ^4.7.0
  firebase_core_platform_interface: ^6.0.3
  firebase_core_tizen: ^2.0.0
  firebase_storage: ^13.3.0
  firebase_storage_platform_interface: ^5.2.20
  flutter:
    sdk: flutter
  http: ^1.1.0
  meta: ^1.10.0
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    implements: firebase_storage
    platforms:
      tizen:
        dartPluginClass: FirebaseStorageTizen
