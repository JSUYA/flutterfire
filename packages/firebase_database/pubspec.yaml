name: firebase_database_tizen
description: Tizen implementation of the firebase_database plugin, backed by the firebase_dart Realtime Database runtime shared with firebase_core_tizen.
version: 0.2.0
homepage: https://github.com/flutter-tizen/flutterfire
repository: https://github.com/flutter-tizen/flutterfire/tree/main/packages/firebase_database

environment:
  flutter: '>=3.27.0'
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  firebase_core: ^4.7.0
  firebase_core_platform_interface: ^6.0.3
  firebase_core_tizen: ^2.0.0
  firebase_database: ^12.3.0
  firebase_database_platform_interface: ^0.3.1+1
  firebase_dart: ^1.6.2
  flutter:
    sdk: flutter
  meta: ^1.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    implements: firebase_database
    platforms:
      tizen:
        dartPluginClass: FirebaseDatabaseTizen
