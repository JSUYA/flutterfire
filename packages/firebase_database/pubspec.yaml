name: firebase_database_tizen
description: Tizen implementation of the firebase_database plugin.
homepage: https://github.com/flutter-tizen/plugins
repository: https://github.com/flutter-tizen/plugins/tree/master/packages/firebase_database
version: 0.2.0

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  firebase_core: ^4.2.0
  firebase_core_tizen: ^0.2.0
  firebase_dart: ^1.6.2
  firebase_database: ^12.0.4
  firebase_database_platform_interface: ^0.2.6+15
  flutter:
    sdk: flutter

dependency_overrides:
  firebase_core_tizen:
    path: ../firebase_core

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    implements: firebase_database
    platforms:
      tizen:
        dartPluginClass: FirebaseDatabaseTizen

false_secrets:
  - /example/lib/main.dart
