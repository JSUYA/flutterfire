name: tests
description: A test app for firebase database plugin (e2e).

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  firebase_core: ^4.7.0
  firebase_core_tizen:
    path: ../../firebase_core
  firebase_database: ^12.0.4
  firebase_database_tizen:
    path: ..
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  integration_test_tizen: ^2.0.1

dependency_overrides:
  firebase_core_tizen:
    path: ../../firebase_core

flutter:
  uses-material-design: true
