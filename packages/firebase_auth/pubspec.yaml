name: firebase_auth_tizen
description: Tizen implementation of the firebase_auth plugin.
homepage: https://github.com/flutter-tizen/plugins
repository: https://github.com/flutter-tizen/plugins/tree/master/packages/firebase_auth
version: 0.1.0

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  firebase_auth: ^6.1.1
  firebase_auth_platform_interface: ^8.1.3
  firebase_core: ^4.2.0
  firebase_core_tizen: ^0.2.0
  firebase_dart: ^1.6.2
  flutter:
    sdk: flutter

dependency_overrides:
  firebase_core_tizen:
    path: ../firebase_core

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    implements: firebase_auth
    platforms:
      tizen:
        dartPluginClass: FirebaseAuthTizen

false_secrets:
  - /example/lib/main.dart
