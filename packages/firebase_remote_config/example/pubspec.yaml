name: firebase_remote_config_tizen_example
description: Demonstrates how to use the firebase_remote_config_tizen plugin.

publish_to: 'none'

environment:
  flutter: '>=3.27.0'
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  firebase_app_installations_tizen: ^0.1.0
  firebase_core: ^4.7.0
  firebase_core_tizen:
    path: ../../firebase_core
  firebase_remote_config: ^6.4.0
  firebase_remote_config_tizen:
    path: ..
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  integration_test_tizen: ^2.0.1

flutter:
  uses-material-design: true

dependency_overrides:
  firebase_app_installations_tizen:
    path: ../../firebase_app_installations
  firebase_core_tizen:
    path: ../../firebase_core
  firebase_core_platform_interface: 4.8.0
