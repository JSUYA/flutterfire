name: firebase_ai_tizen
description: Tizen implementation of the firebase_ai plugin, a pure Dart HTTPS client for Gemini models via Firebase AI Logic.
version: 0.1.0
homepage: https://github.com/flutter-tizen/flutterfire
repository: https://github.com/flutter-tizen/flutterfire/tree/main/packages/firebase_ai

environment:
  flutter: '>=3.27.0'
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  firebase_ai: ^3.11.0
  firebase_core: ^4.7.0
  firebase_core_platform_interface: ^6.0.3
  firebase_core_tizen: ^2.0.0
  flutter:
    sdk: flutter
  http: ^1.1.0
  meta: ^1.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    implements: firebase_ai
    platforms:
      tizen:
        dartPluginClass: FirebaseAiTizen
