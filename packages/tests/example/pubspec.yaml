name: flutterfire_tizen_tests_example
description: End-to-end test harness exercising every firebase_*_tizen plugin together so we can confirm the shared-runtime design prevents TPK bloat.

publish_to: 'none'

environment:
  flutter: '>=3.27.0'
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  cloud_functions: ^6.2.0
  cloud_functions_tizen:
    path: ../../cloud_functions
  firebase_ai: ^3.11.0
  firebase_ai_tizen:
    path: ../../firebase_ai
  firebase_app_installations: ^0.4.2
  firebase_app_installations_tizen:
    path: ../../firebase_app_installations
  firebase_auth: ^6.4.0
  firebase_auth_tizen:
    path: ../../firebase_auth
  firebase_core: ^4.7.0
  firebase_core_tizen:
    path: ../../firebase_core
  firebase_database: ^12.3.0
  firebase_database_tizen:
    path: ../../firebase_database
  firebase_remote_config: ^6.4.0
  firebase_remote_config_tizen:
    path: ../../firebase_remote_config
  firebase_storage: ^13.3.0
  firebase_storage_tizen:
    path: ../../firebase_storage
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  integration_test_tizen: ^2.0.1

flutter:
  uses-material-design: true

dependency_overrides:
  firebase_app_installations_tizen:
    path: ../../firebase_app_installations
  firebase_core_tizen:
    path: ../../firebase_core
  firebase_core_platform_interface: 4.8.0
