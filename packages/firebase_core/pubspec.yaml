name: firebase_core_tizen
description: Tizen implementation of the firebase_core plugin, providing a pure-Dart federated runtime shared by every other Firebase Tizen plugin.
version: 2.0.0
homepage: https://github.com/flutter-tizen/flutterfire
repository: https://github.com/flutter-tizen/flutterfire/tree/main/packages/firebase_core

environment:
  flutter: '>=3.27.0'
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  firebase_core: ^4.7.0
  firebase_core_platform_interface: ^6.0.3
  firebase_dart: ^1.6.2
  flutter:
    sdk: flutter
  http: ^1.1.0
  meta: ^1.10.0
  path: ^1.9.0
  path_provider: ^2.1.0
  # path_provider's Tizen federation is non-endorsed, so we pin it
  # explicitly. Without this dep, getApplicationSupportDirectory throws
  # MissingPluginException on Tizen TV at FirebaseDart.setup time.
  path_provider_tizen: ^2.2.1
  synchronized: ^3.1.0

dev_dependencies:
  fake_async: ^1.3.1
  flutter_test:
    sdk: flutter
  test: ^1.25.0

flutter:
  plugin:
    implements: firebase_core
    platforms:
      tizen:
        dartPluginClass: FirebaseCoreTizen
