name: cloud_functions_example
description: A test app for cloud function plugin (e2e).

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  cloud_functions: ^6.2.0
  cloud_functions_tizen:
    path: ..
  firebase_core: ^4.7.0
  firebase_core_tizen:
    path: ../../firebase_core
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  integration_test_tizen: ^2.0.1

dependency_overrides:
  firebase_core_tizen:
    path: ../../firebase_core

flutter:
  uses-material-design: true
