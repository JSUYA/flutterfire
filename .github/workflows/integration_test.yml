name: integration_test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  integration_test:
    runs-on: [self-hosted]
    timeout-minutes: 60
    if: ${{ github.repository_owner == 'flutter-tizen' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install flutter-tizen
        uses: actions/checkout@v4
        with:
          repository: flutter-tizen/flutter-tizen
          path: flutter-tizen
      - name: Apply Firebase test credentials
        run: |
          # PRE_INSTALLER is a secret shell script that writes the
          # example/lib/firebase_options.dart file for every package
          # using credentials owned by the flutter-tizen Firebase project.
          bash ${{ secrets.PRE_INSTALLER }}
      - name: Install plugin tool dependencies
        run: dart pub get
        working-directory: tools
      - name: Run integration tests
        run: |
          export PATH=`pwd`/flutter-tizen/bin:$PATH
          ./tools/tools_runner.sh integration-test --generate-emulators --recipe ./.github/recipe.yaml
