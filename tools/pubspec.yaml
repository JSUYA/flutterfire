name: flutter_tizen_plugin_tools
description: Productivity utils for flutter-tizen/plugins.
repository: https://github.com/flutter-tizen/plugins/tree/master/tools
publish_to: "none"

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  args: ^2.4.0
  file: ^7.0.0
  # Pinned to the same base flutter/packages script/tool ref used by
  # flutter-tizen/plugins so that the lint/format/build-examples contract
  # matches upstream exactly.
  flutter_plugin_tools: ^0.14.0
  http: ^1.1.0
  path: ^1.9.0
  platform: ^3.1.0
  pub_semver: ^2.1.4
  yaml: ^3.1.2

dev_dependencies:
  mocktail: ^1.0.0
  test: ^1.25.0
